<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
    />

    <link
      rel="icon"
      href="data:image/svg+xml,
  <svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'>
    <text y='.9em' font-size='80'>🐶</text>
  </svg>"
    />

    <link rel="stylesheet" href="./assets/styles.css" />

    <title>FNS - PETS!</title>
  </head>

  <body>
    <nav class="navbar navbar-expand-lg navbar-light bg-warning px-4">
      <div class="container">
        <a class="navbar-brand ms-1" href="/index.html">
          <img
            src="./assets/img/logo-fofinho.png"
            alt="Logo"
            title="Nunca Sozinhos"
            class="navbar-brand-img"
            style="height: 32px"
          />
        </a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div
          class="collapse navbar-collapse justify-content-end"
          id="navbarNav"
        >
          <ul class="navbar-nav">
            <li class="nav-item">
              <a class="nav-link" aria-current="page" href="/index.html"
                >Início</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link" href="/owners.html">Tutores</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" href="/pets.html">Pets</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="/takers.html">Cuidadores</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <main class="container mt-5 mb-5 main-cal">
      <div class="row mb-4">
        <div class="col text-end">
          <button class="btn btn-warning" onclick="showPetForm()">
            🐾 Adicionar Pet
          </button>
        </div>
      </div>

      <!-- FORMULÁRIO -->
      <div class="row fade d-none" id="pet-form-card">
        <div class="col-12">
          <div class="bg-white rounded shadow-sm p-4">
            <h5 class="mb-3">Informe os dados</h5>
            <form onsubmit="createOrUpdatePet(event)">
              <div class="row mb-3">
                <div class="col-md-3">
                  <label for="name" class="form-label">Nome*</label>
                  <input type="text" class="form-control" id="name" />
                  <div class="invalid-feedback">Mínimo de 3 caracteres</div>
                </div>
                <div class="col-md-3">
                  <label for="age" class="form-label"
                    >Idade
                    <span class="small text-muted">(Em anos)</span></label
                  >
                  <input type="number" class="form-control" id="age" min="0" />
                </div>
                <div class="col-md-3">
                  <label for="size" class="form-label">Porte</label>
                  <select class="form-select" id="size">
                    <option value="">Selecione</option>
                    <option value="Pequeno">Pequeno</option>
                    <option value="Médio">Médio</option>
                    <option value="Grande">Grande</option>
                  </select>
                </div>
                <div class="col-md-3">
                  <label for="ownerId" class="form-label">Tutor</label>
                  <select class="form-select" id="ownerId">
                    <!-- Opções dinâmicas -->
                  </select>
                </div>
              </div>

              <div class="mb-3">
                <label for="notes" class="form-label">Observações</label>
                <textarea class="form-control" id="notes" rows="2"></textarea>
              </div>

              <div class="text-end">
                <button
                  type="button"
                  class="btn btn-secondary me-2"
                  onclick="hidePetForm()"
                >
                  Cancelar
                </button>
                <button
                  type="submit"
                  class="btn btn-warning"
                  id="submit-button"
                >
                  Confirmar
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>

      <!-- LOADING -->
      <div class="row">
        <div class="col-12">
          <div
            class="bg-white rounded shadow-sm p-4 min-card d-flex flex-column justify-content-center align-items-center d-none"
            id="loading-indicator"
          >
            <div class="spinner-border text-warning" role="status">
              <span class="visually-hidden">Carregando...</span>
            </div>
            <p class="mt-3 text-muted">Carregando pets...</p>
          </div>
        </div>
      </div>

      <!-- TABELA -->
      <div class="row fade show" id="pets-table-card">
        <div class="col-12">
          <div class="bg-white rounded shadow-sm p-4" id="pets-table-wrapper">
            <div id="pets-table-container"></div>
          </div>
        </div>
      </div>
    </main>

    <!-- Rodapé fixo -->
    <footer class="text-black text-center py-3">
      <small> &copy; Todos os direitos reservados - </small>
      <small> <span id="current-year"></span></small>
    </footer>

    <!-- Container de Toasts -->
    <div
      class="position-fixed top-0 start-50 translate-middle-x p-3"
      style="z-index: 1100"
    >
      <!-- Toast: Adicionado -->
      <div
        id="toastAdded"
        class="toast align-items-center text-white bg-success border-0"
        role="alert"
      >
        <div class="d-flex">
          <div class="toast-body">
            <i class="bi bi-check-circle me-2"></i>
            Tutor adicionado com sucesso!
          </div>
          <button
            type="button"
            class="btn-close btn-close-white me-2 m-auto"
            data-bs-dismiss="toast"
          ></button>
        </div>
      </div>

      <!-- Toast: Alterado -->
      <div
        id="toastUpdated"
        class="toast align-items-center text-white bg-primary border-0"
        role="alert"
      >
        <div class="d-flex">
          <div class="toast-body">
            <i class="bi bi-pencil-square me-2"></i>
            Tutor alterado com sucesso!
          </div>
          <button
            type="button"
            class="btn-close btn-close-white me-2 m-auto"
            data-bs-dismiss="toast"
          ></button>
        </div>
      </div>

      <!-- Toast: Excluído -->
      <div
        id="toastDeleted"
        class="toast align-items-center text-white bg-danger border-0"
        role="alert"
      >
        <div class="d-flex">
          <div class="toast-body">
            <i class="bi bi-trash3 me-2"></i>
            Tutor excluído com sucesso!
          </div>
          <button
            type="button"
            class="btn-close btn-close-white me-2 m-auto"
            data-bs-dismiss="toast"
          ></button>
        </div>
      </div>
    </div>

    <div
      class="modal fade"
      id="deleteConfirmModal"
      tabindex="-1"
      aria-labelledby="deleteConfirmLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow">
          <div class="modal-header bg-danger text-white">
            <h5 class="modal-title" id="deleteConfirmLabel">
              Confirmar exclusão
            </h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Fechar"
            ></button>
          </div>
          <div class="modal-body">Tem certeza que deseja excluir este Pet?</div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Cancelar
            </button>
            <button
              type="button"
              class="btn btn-danger"
              onclick="confirmDeletePet()"
            >
              Confirmar exclusão
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="./js/pets.js"></script>

    <!-- Script para obter o ano atual -->
    <script>
      document.getElementById("current-year").textContent =
        new Date().getFullYear();
    </script>

    <!-- Optional JavaScript; choose one of the two! -->

    <!-- Option 1: Bootstrap Bundle with Popper -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
      crossorigin="anonymous"
    ></script>

    <script>
      const showToast = (id) => {
        const toast = new bootstrap.Toast(document.getElementById(id));
        toast.show();
      };

      // Exemplos de uso:
      // showToast('toastAdded');
      // showToast('toastUpdated');
      // showToast('toastDeleted');
    </script>

    <!-- Option 2: Separate Popper and Bootstrap JS -->

    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js" integrity="sha384-IQsoLXl5PILFhosVNubq5LC7Qb9DXgDA9i+tQ8Zj3iwWAwPtgFTxbJ8NT4GN1R8p" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.min.js" integrity="sha384-cVKIPhGWiC2Al4u+LWgxfKTRIcfu0JTxR+EQDz/bgldoEyl4H0zUF0QKbrJ0EcQF" crossorigin="anonymous"></script>
    -->
  </body>
</html>
